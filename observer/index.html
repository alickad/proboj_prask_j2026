<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <title>Proboj observer</title>
</head>
<body onload="init()">
    <div id="upload_div">
        <p>Choose game replay:</p>
        <p><input id="upload_input" type="file" title="Upload game..."></p>
    </div>
    <div id="controls">
        <button class="action_button">Slower</button>
        <button class="action_button" onclick="focusPreviousTurn()">Previous</button>
        <button class="action_button" id="pause_button" onclick="game_controls_action('pause')">Pause</button>
        <button class="action_button" onclick="focusNextTurn()">Next</button>
        <button class="action_button">Faster</button>
        <button onclick="DEBUGisinview()">DEBUG</button>
    </div>
    <div id="replay_canvas">
        <div id="replay_canvas_history">
            <div id="history_turn_counter"></div>
            <div id="p1_history"></div>
            <!-- <div id="replay_canvas_separator"></div> -->
            <div id="p2_history"></div>
        </div>
        <div id="replay_canvas_current">
            <div id="current_turn_p1"><p id="current_turn_p1_text">p1</p></div>
            <div id="current_turn_p2"><p id="current_turn_p2_text">p2</p></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
