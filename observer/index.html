<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <title>Proboj observer</title>
</head>
<body onload="init()">
    <h1>Game replay</h1>
    <div id="upload_div">
        <p>Choose game replay:</p>
        <p><input id="upload_input" type="file" title="Upload game..."></p>
    </div>
    <div id="controls">
        <p>
            <button class="action_button button_slower" onclick="setReplaySpeed(ANIMATION_SPEED + 0.05)">Slower</button>
            <button class="action_button button_previous" onclick="previousTurn()">Previous</button>
            <button class="action_button button_play" id="pause_button" onclick="pauseButtonPress()">Play</button>
            <button class="action_button button_next" onclick="nextTurn()">Next</button>
            <button class="action_button button_faster" onclick="setReplaySpeed(ANIMATION_SPEED - 0.05)">Faster</button>
            <!-- <button onclick="animateTurn()">DEBUG</button> -->
        </p>
        <div></div>
        <p>
            Replay speed:
            <input type="number" name="replay_speed" id="replay_speed_input" step="0.05" min="0.1">
        </p>
        <div class="score_div">
            <button class="action_button button_show_scores" onclick="showScore()">Show score</button>
            <!-- <p id="scores_text">Scores not loaded.</p> -->
        </div>
    </div>
    <div id="replay_canvas">
        <div id="replay_canvas_history">
            <div id="history_turn_counter"></div>
            <div id="p1_history"></div>
            <!-- <div id="replay_canvas_separator"></div> -->
            <div id="p2_history"></div>
        </div>
        <div id="replay_canvas_current">
            <div id="current_turn_p1"><p id="current_turn_p1_text">p1</p><p id="current_turn_result_text_p1">ahoj</p></div>
            <div id="current_turn_p2"><p id="current_turn_p2_text">p2</p><p id="current_turn_result_text_p2">ahoj</p></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
