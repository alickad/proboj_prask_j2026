<!-- Start by: `python -m http.server` in this directory -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Scores</title>
  <style>
    body {
        background-color: black;
        color: white;
    }
    h2 {
        margin-top: 30px;
        margin-left: 50px;
    }
    #score-list {
        display: grid;
        grid-template-columns: auto, 1fr, auto;
        border: solid 1 white;
    }
  </style>
</head>
<body>
  <h2>Leaderboard</h2>
  <div id="score-list"></div>

  <script>
    fetch('output/scores.json')
      .then(response => response.json())
      .then(data => {
        const list = document.getElementById('score-list');
        Object.keys(data)
        .sort((key1, key2) => Number(data[key1]) < Number(data[key2]))
        .forEach(key => {
          const li = document.createElement('div');
          li.textContent = `${key}: ${data[key]}`;
          list.appendChild(li);
        });
      })
      .catch(error => console.error('Error loading scores:', error));
  </script>
</body>
</html>
